<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded frame suggesting a canvas/display -->
  <rect x="14" y="14" width="72" height="72" rx="14" fill="none" stroke="#E8613C" stroke-width="7" opacity="0.35"/>
  <!-- Tapered brushstroke: thick at start, curving and thinning to a point -->
  <path d="M24 30
           C 30 20, 44 18, 54 26
           C 64 34, 70 46, 80 44
           C 84 43, 85 46, 81 48
           C 70 53, 62 40, 52 34
           C 44 29, 34 30, 28 38
           C 25 42, 21 38, 24 30 Z"
        fill="#E8613C" opacity="0.9"/>
  <!-- Second lighter tapered stroke, curving the other way -->
  <path d="M26 66
           C 34 58, 48 60, 56 70
           C 64 80, 72 82, 80 76
           C 83 74, 85 77, 82 80
           C 74 88, 62 84, 54 76
           C 47 69, 36 66, 30 72
           C 27 75, 23 71, 26 66 Z"
        fill="#E8613C" opacity="0.5"/>
</svg>
