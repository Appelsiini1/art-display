<!doctype html>
<html>
  <head>
    <title>Scanner Run Statistics</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  </head>
  <body class="stats-page">
    <main class="stats-container">
      <header class="stats-header">
        <div>
          <p class="eyebrow">Operational overview</p>
          <h1>Scanner Run Statistics</h1>
        </div>
        <div class="stats-header-actions">
          <a class="stats-link" href="/statistics">Statistics</a>
          <a class="stats-link secondary" href="/settings.html">Settings</a>
        </div>
      </header>

      <section class="stats-toolbar">
        <label for="range-select">Time range</label>
        <select id="range-select" aria-label="Select time range">
          <option value="24">Last 24 hours</option>
          <option value="168" selected>Last 7 days</option>
          <option value="720">Last 30 days</option>
          <option value="2160">Last 90 days</option>
        </select>
      </section>

      <div id="status-message" class="status-message" aria-live="polite"></div>

      <section class="stats-grid" aria-label="Summary metrics">
        <article class="stat-card">
          <span class="stat-label">Total runs</span>
          <strong id="stat-runs" class="stat-value">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Scanned</span>
          <strong id="stat-scanned" class="stat-value">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Processed</span>
          <strong id="stat-processed" class="stat-value">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">NSFW hits</span>
          <strong id="stat-nsfw" class="stat-value">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">SFW hits</span>
          <strong id="stat-sfw" class="stat-value">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Errors</span>
          <strong id="stat-errors" class="stat-value">0</strong>
        </article>
        <article class="stat-card wide">
          <span class="stat-label">Avg duration</span>
          <strong id="stat-duration" class="stat-value">0s</strong>
        </article>
      </section>

      <section class="stats-panel">
        <div class="panel-header">
          <h2>Recent run history</h2>
        </div>

        <div class="table-wrap">
          <table class="history-table">
            <thead>
              <tr>
                <th>Started</th>
                <th>Finished</th>
                <th>Duration</th>
                <th>Scanned</th>
                <th>Processed</th>
                <th>NSFW</th>
                <th>SFW</th>
                <th>Errors</th>
              </tr>
            </thead>
            <tbody id="history-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/statistics/scan-runs.js"></script>
  </body>
</html>
