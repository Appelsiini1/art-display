<!doctype html>
<html>
  <head>
    <title>Statistics</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  </head>
  <body class="stats-page">
    <main class="stats-container">
      <header class="stats-header">
        <div>
          <p class="eyebrow">Operational overview</p>
          <h1>Statistics</h1>
        </div>
        <div class="stats-header-actions">
          <a class="stats-link" href="/settings.html">Settings</a>
          <a class="stats-link secondary" href="/index.html">Gallery</a>
        </div>
      </header>

      <section class="stats-panel">
        <div class="panel-header">
          <h2>Available dashboards</h2>
        </div>

        <div class="stats-landing-grid">
          <a class="stats-card-link" href="/statistics/scan-runs">
            <span class="stats-card-link-label">Scanner runs</span>
            <strong>Recent scan history</strong>
            <small>Time-window summaries and run-by-run metrics</small>
          </a>

          <a class="stats-card-link" href="/statistics/image-serves">
            <span class="stats-card-link-label">Image serves</span>
            <strong>Random image usage</strong>
            <small>Serve totals, SFW/NSFW mix, top files, and top artists</small>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
