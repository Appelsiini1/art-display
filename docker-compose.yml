services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - 54560:9000 # only the API is exposed to the host
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL}
      SCANNER_PATH: ${SCANNER_PATH}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    volumes:
      - /mnt/r:/mnt/r:ro

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/
    # NO `ports:` — the database is only reachable from the `backend` network
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  scanner:
    build: ./scanner
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      SCANDIR: ${SCANNER_PATH}
      IGNORE_TAGS: ${IGNORE_TAGS}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    volumes:
      - /mnt/r:/mnt/r:ro

  tagger:
    build:
      context: ./tagger
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TAGGER_IMAGE_ROOT: /images
      TAGGER_EXECUTION_MODE: serial
      IMAGE_ROOT: ${IMAGE_ROOT}
      LOG_LEVEL: DEBUG #${LOG_LEVEL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - /mnt/r:/images
      - hf-cache:/root/.cache/huggingface

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  hf-cache:
